<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tank Duels</title>
    <link rel="stylesheet" href="style.css">
    <link rel="shortcut icon" type="image/png" href="img/favicon.png">
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.60.0/dist/phaser.min.js"></script>
</head>
<body>

    <div id="game-container"></div>

    <div id="menu-wrapper">
        
        <div id="shop-red" class="shop-panel">
            <h2 style="color: #ff5555;">RED SHOP</h2>
            <div class="shop-coins">Coins: <span id="shop-coins-red">0</span></div>

            <div class="upgrade-item">
                <label>Szybkostrzelność (Lvl <span id="lvl-rate-red">0</span>/5)</label>
                <div class="bar-container"><div id="bar-rate-red" class="bar-fill" style="width:0%"></div></div>
                <button class="buy-btn" id="buy-rate-red" onclick="buyUpgrade('red', 'rate')">UPGRADE (10$)</button>
            </div>

            <div class="upgrade-item">
                <label>Max HP (<span id="val-hp-red">1</span>/3 ❤️)</label>
                <button class="buy-btn" id="buy-hp-red" onclick="buyUpgrade('red', 'hp')">UPGRADE (20$)</button>
            </div>

            <div class="upgrade-item">
                <label>Malowanie</label>
                <div class="color-grid" id="colors-red">
                    </div>
            </div>
        </div>

        <div id="main-menu">
            <div id="volume-control">
                <label for="music-slider">Muzyka 🎵</label>
                <input type="range" id="music-slider" min="0" max="1" step="0.1" value="0.5">
            </div>
            <img src="img/logo.png" alt="Tank Duels"/>
            
            <div class="menu-group">
                <label>Wybierz Mapę:</label>
                <select id="map-select">
                    <option value="1">Baza Wojskowa (Standard)</option>
                    <option value="2">Neon City (Colors)</option>
                    <option value="3">Arena Centralna (Otwarta)</option>
                    <option value="4">Autorska mapa</option>
                </select>
            </div>

            <div class="menu-group checkbox-group">
                <input type="checkbox" id="ricochet-toggle">
                <label for="ricochet-toggle">Rykoszety</label>
            </div>
            <div class="menu-group checkbox-group" style="margin-top: 5px;">
                <input type="checkbox" id="speed-toggle">
                <label for="speed-toggle" style="color: #00e676;">SPEED MODE ⚡</label>
            </div>

            <button id="start-btn" onclick="startGame()">ROZPOCZNIJ WALKĘ</button>
        </div>

        <div id="shop-blue" class="shop-panel">
            <h2 style="color: #5555ff;">BLUE SHOP</h2>
            <div class="shop-coins">Coins: <span id="shop-coins-blue">0</span></div>

             <div class="upgrade-item">
                <label>Szybkostrzelność (Lvl <span id="lvl-rate-blue">0</span>/5)</label>
                <div class="bar-container"><div id="bar-rate-blue" class="bar-fill" style="width:0%"></div></div>
                <button class="buy-btn" id="buy-rate-blue" onclick="buyUpgrade('blue', 'rate')">UPGRADE (10$)</button>
            </div>

            <div class="upgrade-item">
                <label>Max HP (<span id="val-hp-blue">1</span>/3 ❤️)</label>
                <button class="buy-btn" id="buy-hp-blue" onclick="buyUpgrade('blue', 'hp')">UPGRADE (20$)</button>
            </div>

            <div class="upgrade-item">
                <label>Malowanie</label>
                <div class="color-grid" id="colors-blue">
                    </div>
            </div>
        </div>

    </div>

    <div id="game-over-screen">
        <h1 id="winner-header">KONIEC GRY</h1>
        <div id="winner-display" class="winner-text"></div>
        
        <div class="stats">
            <div class="stat-row">
                <span class="red-txt">Czerwony (strzały):</span>
                <span id="red-stats">0</span>
            </div>
            <div class="stat-row">
                <span class="blue-txt">Niebieski (strzały):</span>
                <span id="blue-stats">0</span>
            </div>
        </div>

        <button class="small-btn" onclick="showMenu()">MENU GŁÓWNE</button>
        <button class="big-btn" onclick="restartMatch()">REWANŻ</button>
    </div>

    <script src="maps.js"></script>
    <script src="game.js"></script>
</body>
</html>
