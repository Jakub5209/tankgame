<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tactical Tank Battle</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.60.0/dist/phaser.min.js"></script>
</head>
<body>

    <div id="game-container"></div>

    <div id="main-menu">
        <div id="volume-control">
            <label for="music-slider">Muzyka 🎵</label>
            <input type="range" id="music-slider" min="0" max="1" step="0.1" value="0.5">
        </div>
        <h1>TANK BATTLE <span style="color:#ff4d4d">2</span><span style="color:#4d4dff">D</span></h1>
        
        <div class="stats" style="margin-bottom: 20px; background: rgba(0,0,0,0.6);">
            <div style="color: #ffd700; font-weight: bold; margin-bottom: 10px;">BANK (Total Coins)</div>
            <div class="stat-row">
                <span style="color: #ff5555; font-weight: bold;">Red:</span>
                <span id="coin-display-red" style="color: gold;">0</span>
            </div>
            <div class="stat-row">
                <span style="color: #5555ff; font-weight: bold;">Blue:</span>
                <span id="coin-display-blue" style="color: gold;">0</span>
            </div>
        </div>

        <div class="menu-group">
            <label>Wybierz Mapę:</label>
            <select id="map-select">
                <option value="1">Baza Wojskowa (Standard)</option>
                <option value="2">Neon City (Colors)</option>
            </select>
        </div>

        <div class="menu-group checkbox-group">
            <input type="checkbox" id="ricochet-toggle">
            <label for="ricochet-toggle">Rykoszety (Odbijanie pocisków)</label>
        </div>

        <button id="start-btn" onclick="startGame()">ROZPOCZNIJ WALKĘ</button>
    </div>

    <div id="game-over-screen">
        <h1 id="winner-header">KONIEC GRY</h1>
        <div id="winner-display" class="winner-text"></div>
        
        <div class="stats">
            <div class="stat-row">
                <span class="red-txt">Czerwony (strzały):</span>
                <span id="red-stats">0</span>
            </div>
            <div class="stat-row">
                <span class="blue-txt">Niebieski (strzały):</span>
                <span id="blue-stats">0</span>
            </div>
        </div>

        <button class="small-btn" onclick="showMenu()">MENU GŁÓWNE</button>
        <button class="big-btn" onclick="restartMatch()">REWANŻ</button>
    </div>

    <script src="maps.js"></script>
    <script src="game.js"></script>
</body>
</html>
